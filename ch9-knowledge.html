<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge is knowledge</title>
<style>
  :root {
    --bg: #0b0b0e;
    --ink: #e8e3da;
    --muted: #8a847b;
    --faint: #4a4640;
    --tense: #dc143c;
    --sent: #3d8fd6;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif; color: var(--ink);
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .label { position: fixed; left: 50%; transform: translateX(-50%);
           text-align: center; pointer-events: none; width: min(92%, 680px); }
  #title { top: 3.5%; font-size: clamp(13px, 2.4vw, 19px);
           letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  #caption { bottom: 9%; font-size: clamp(13px, 2.2vw, 18px); line-height: 1.45;
             transition: opacity .6s ease; }
  #caption em { font-style: normal; }
  #note { bottom: 3%; font-size: clamp(10px, 1.6vw, 12px); color: var(--faint);
          font-style: italic; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label" id="title">Chapter 9 &middot; knowledge is knowledge</div>
<div class="label" id="caption"></div>
<div class="label" id="note">Schematic: these are illustrative curves, not the measured profiles, tuned so their correlations match the measured values shown.</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const cap = document.getElementById('caption');

  const NETS = ['Pythia-410m', 'Qwen2-0.5B', 'OPT-1.3B', 'Phi-1.5', 'GPT-Neo-1.3B'];
  const OPT = 2, PHI = 3;
  const TAU = Math.PI * 2;

  // ---- wave definitions (schematic) ----
  // tense: one shared shape + a smaller individual part per network
  const tenseBase = t => 0.62 * Math.sin(TAU * 1.35 * t + 0.4)
                       + 0.28 * Math.sin(TAU * 3.6 * t + 1.1);
  const tenseOwn = [
    [2.2, 0.3], [2.9, 2.1], [1.8, 4.0], [3.3, 1.2], [2.5, 5.2]
  ];
  // weights tuned so the drawn curves' mean pairwise r = +0.22 (the measured value)
  const tense = (i, t) =>
    0.5 * tenseBase(t) + 0.8 * Math.sin(TAU * tenseOwn[i][0] * t + tenseOwn[i][1]);

  // sentiment: each network its own path; Phi is OPT mirrored
  const sentOwn = [
    [[1.1, 0.2], [3.9, 2.4]],
    [[2.4, 3.1], [4.6, 0.7]],
    [[1.4, 1.0], [3.0, 4.2]],
    null,
    [[2.0, 5.0], [3.6, 1.9]],
  ];
  function sent(i, t) {
    // Phi = OPT mirrored plus its own part, tuned so the drawn r = -0.88 (measured)
    if (i === PHI) return -sent(OPT, t) + 0.37 * Math.sin(TAU * 2.7 * t + 0.9);
    const [[f1, p1], [f2, p2]] = sentOwn[i];
    return 0.62 * Math.sin(TAU * f1 * t + p1) + 0.34 * Math.sin(TAU * f2 * t + p2);
  }

  // ---- story ----
  const PHASES = [
    { key: 'tense', dur: 7.5,
      text: '<em style="color:var(--tense)">Tense</em> &mdash; meaning spelled in the word itself. ' +
            'Five networks from four labs share part of its shape through depth &mdash; a modest share, but more than chance. ' +
            '<span style="color:var(--muted)">Mean r = +0.22, beyond chance (p &asymp; 0.013), on sentences none had seen.</span>' },
    { key: 'sent', dur: 7.5,
      text: '<em style="color:var(--sent)">Sentiment</em> &mdash; meaning built between the words. ' +
            'Each network finds its own path. ' +
            '<span style="color:var(--muted)">Mean r &asymp; 0.</span>' },
    { key: 'mirror', dur: 8,
      text: 'Except two. <em style="color:var(--sent)">OPT</em> and <em style="color:var(--sent)">Phi</em> ' +
            'hold sentiment as mirror images &mdash; the same beat, half a cycle apart. ' +
            '<span style="color:var(--muted)">r = &minus;0.88, beyond chance.</span>' },
  ];
  const TOTAL = PHASES.reduce((s, p) => s + p.dur, 0);
  let lastKey = null;

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', size);
  size();

  const smooth = x => x * x * (3 - 2 * x);

  function drawLane(i, y, h, x0, x1, fn, color, alpha, progress, emph) {
    // baseline
    ctx.globalAlpha = 0.18 * alpha + (emph ? 0.1 : 0);
    ctx.strokeStyle = '#8a847b';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();

    // label
    ctx.globalAlpha = (emph ? 1 : 0.75) * Math.max(alpha, 0.35);
    ctx.fillStyle = emph ? '#e8e3da' : '#8a847b';
    ctx.font = `${Math.max(11, Math.min(14, innerWidth / 55))}px Georgia, serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(NETS[i], x0 - 12, y);

    // wave, drawn left to right up to `progress`
    const steps = 160;
    const n = Math.max(2, Math.floor(steps * progress));
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = emph ? 2.6 : 2;
    ctx.shadowColor = color;
    ctx.shadowBlur = emph ? 14 : 6;
    ctx.beginPath();
    let hx = x0, hy = y;
    for (let k = 0; k <= n; k++) {
      const t = k / steps;
      const x = x0 + t * (x1 - x0);
      const yy = y - fn(i, t) * h * 0.42;
      if (k === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      hx = x; hy = yy;
    }
    ctx.stroke();
    // travelling head
    if (progress < 1) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(hx, hy, emph ? 4 : 3, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  const start = performance.now();
  function frame(now) {
    const t = ((now - start) / 1000) % TOTAL;
    let acc = 0, phase = PHASES[0], local = 0;
    for (const p of PHASES) {
      if (t < acc + p.dur) { phase = p; local = t - acc; break; }
      acc += p.dur;
    }
    if (phase.key !== lastKey) {
      cap.style.opacity = 0;
      setTimeout(() => { cap.innerHTML = phase.text; cap.style.opacity = 1; }, 300);
      lastKey = phase.key;
    }

    const W = innerWidth, H = innerHeight;
    ctx.clearRect(0, 0, W, H);

    const left = Math.min(150, W * 0.28);
    const x0 = left, x1 = W - Math.max(16, W * 0.06);
    const top = H * 0.13, bottom = H * 0.71;
    const laneH = (bottom - top) / NETS.length;

    // depth axis hint
    ctx.fillStyle = '#4a4640';
    ctx.font = `${Math.max(10, Math.min(12, W / 70))}px Georgia, serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('first layer', x0, bottom + 4);
    ctx.textAlign = 'right';
    ctx.fillText('last layer  \u2192  depth', x1, bottom + 4);

    const draw = Math.min(1, local / (phase.dur * 0.55));
    const fadeIn = smooth(Math.min(1, local / 0.6));
    const fadeOut = smooth(Math.min(1, (phase.dur - local) / 0.6));
    const a = fadeIn * fadeOut;

    for (let i = 0; i < NETS.length; i++) {
      const y = top + laneH * (i + 0.5);
      if (phase.key === 'tense') {
        drawLane(i, y, laneH, x0, x1, tense, '#dc143c', a, draw, false);
      } else if (phase.key === 'sent') {
        drawLane(i, y, laneH, x0, x1, sent, '#3d8fd6', a, draw, false);
      } else {
        const emph = (i === OPT || i === PHI);
        drawLane(i, y, laneH, x0, x1, sent, '#3d8fd6',
                 a * (emph ? 1 : 0.18), 1, emph);
      }
    }

    // mirror bracket between OPT and Phi
    if (phase.key === 'mirror') {
      const yA = top + laneH * (OPT + 0.5), yB = top + laneH * (PHI + 0.5);
      const bx = x1 + Math.min(10, W * 0.02);
      ctx.globalAlpha = a * 0.7;
      ctx.strokeStyle = '#e8e3da'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(bx - 4, yA); ctx.lineTo(bx, yA); ctx.lineTo(bx, yB); ctx.lineTo(bx - 4, yB);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
